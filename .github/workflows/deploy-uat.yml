
name: Deploy House of Diams UAT

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.UAT_EC2_HOST }}
          EC2_USER: ${{ secrets.UAT_EC2_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.UAT_EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hod_deploy_key
          chmod 600 ~/.ssh/hod_deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/hod_deploy_key \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -e
          cd /var/www/html/HOD
          git fetch origin main
          git reset --hard origin/main
          npm ci
          npm run build
          systemctl restart hod-storefront
          systemctl is-active --quiet hod-storefront
          REMOTE

      - name: Check UAT website
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 \
            https://houseofdiams.com/
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 \
            https://houseofdiams.com/api/readiness/db
